name: PurpleKit
options:
  bundleIdPrefix: com.kemi579
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.kemi579.PurpleKit
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_CFBundleDisplayName: "PurpleKit"
    INFOPLIST_KEY_LSRequiresIPhoneOS: "YES"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PurpleKit connects to your paired iPhone to install signed applications."
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
packages:
  SideSign:
    url: https://github.com/SideStore/SideSign.git
    branch: main
  # minimuxer must be a local package: its Package.swift uses path deps
  # (Common/, DeviceGateway/). Remote URL + path deps is unsupported by SPM.
  # CI / local setup clones it into Dependencies/minimuxer before xcodegen.
  Minimuxer:
    path: Dependencies/minimuxer
targets:
  PurpleKit:
    type: application
    platform: iOS
    dependencies:
      - package: SideSign
        product: SideSign
      - package: Minimuxer
        product: Minimuxer
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: PurpleKit
        PRODUCT_BUNDLE_IDENTIFIER: com.kemi579.PurpleKit
schemes:
  PurpleKit:
    build:
      targets:
        PurpleKit: all
    run:
      config: Debug
    archive:
      config: Release
