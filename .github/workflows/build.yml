name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme PurpleKit \
            -configuration Release \
            -archivePath build/PurpleKit.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -euo pipefail
          test -d build/PurpleKit.xcarchive/Products/Applications/PurpleKit.app
          mkdir -p Payload
          cp -r build/PurpleKit.xcarchive/Products/Applications/PurpleKit.app Payload/
          zip -r PurpleKit.ipa Payload
          ls -la PurpleKit.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpleKit-ipa
          path: PurpleKit.ipa
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Build
          body: "Unsigned IPA for AltStore / SideStore / Sideloadly. Install with your free Apple ID."
          files: PurpleKit.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
