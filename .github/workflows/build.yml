name: Build IPA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purplekit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme PurpleKit \
            -configuration Release \
            -archivePath build/PurpleKit.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -euo pipefail
          test -d build/PurpleKit.xcarchive/Products/Applications/PurpleKit.app
          rm -rf Payload PurpleKit.ipa
          mkdir -p Payload
          cp -R build/PurpleKit.xcarchive/Products/Applications/PurpleKit.app Payload/
          /usr/bin/zip -qry PurpleKit.ipa Payload
          test -s PurpleKit.ipa
          unzip -l PurpleKit.ipa | grep -q 'Payload/PurpleKit.app/Info.plist'
          ls -lh PurpleKit.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpleKit-ipa
          path: PurpleKit.ipa
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Latest Build
          body: "Unsigned IPA for installation using a compatible sideloading tool. This artifact is not signed for direct installation."
          files: PurpleKit.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
